##############################################################################
# Cloud Run Service — hello-world-dotnet
#
# Deploy:
#   gcloud run services replace deploy/cloudrun/service.yaml \
#     --region REGION
#
# Or use environment overlays:
#   ./deploy/cloudrun/deploy.sh staging  us-central1
#   ./deploy/cloudrun/deploy.sh production australia-southeast1
##############################################################################
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: hello-world-dotnet
  labels:
    app: hello-world-dotnet
    managed-by: gcloud
  annotations:
    # Allow unauthenticated requests (change to authenticated for internal services)
    run.googleapis.com/ingress: all

spec:
  template:
    metadata:
      annotations:
        # Scale to zero when idle — set min-instances > 0 to eliminate cold starts
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"

        # CPU is only allocated during request processing (cost-efficient default)
        run.googleapis.com/cpu-throttling: "true"

    spec:
      containerConcurrency: 80   # Max concurrent requests per container instance
      timeoutSeconds: 300

      containers:
        - image: <+artifacts.primary.image>
          ports:
            - name: http1
              containerPort: 8080

          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:8080

          resources:
            limits:
              cpu: "1"
              memory: 512Mi

          livenessProbe:
            httpGet:
              path: /healthz
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /healthz
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
