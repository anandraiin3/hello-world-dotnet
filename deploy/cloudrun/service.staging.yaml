##############################################################################
# Cloud Run Service — staging overrides
#
# Deploy:
#   ./deploy/cloudrun/deploy.sh staging us-central1
##############################################################################
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: hello-world-dotnet-staging
  labels:
    app: hello-world-dotnet
    env: staging
    managed-by: gcloud
  annotations:
    run.googleapis.com/ingress: all

spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/cpu-throttling: "true"

    spec:
      containerConcurrency: 80
      timeoutSeconds: 300

      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/hello-world-dotnet/hello-world-dotnet:IMAGE_TAG
          ports:
            - name: http1
              containerPort: 8080

          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Staging
            - name: ASPNETCORE_URLS
              value: http://+:8080

          resources:
            limits:
              cpu: "1"
              memory: 256Mi

          livenessProbe:
            httpGet:
              path: /healthz
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /healthz
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
