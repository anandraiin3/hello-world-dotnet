##############################################################################
# Cloud Run Service — production overrides
#
# Deploy:
#   ./deploy/cloudrun/deploy.sh production australia-southeast1
##############################################################################
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: hello-world-dotnet
  labels:
    app: hello-world-dotnet
    env: production
    managed-by: gcloud
  annotations:
    run.googleapis.com/ingress: all

spec:
  template:
    metadata:
      annotations:
        # Keep 1 warm instance in production to eliminate cold starts
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "20"
        # Always-on CPU for production (handles background work, better latency)
        run.googleapis.com/cpu-throttling: "false"

    spec:
      containerConcurrency: 80
      timeoutSeconds: 300

      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/hello-world-dotnet/hello-world-dotnet:IMAGE_TAG
          ports:
            - name: http1
              containerPort: 8080

          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:8080

          resources:
            limits:
              cpu: "2"
              memory: 512Mi

          livenessProbe:
            httpGet:
              path: /healthz
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /healthz
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
