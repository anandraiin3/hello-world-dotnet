pipeline:
  name: hello-world-dotnet CD
  identifier: hello_world_dotnet_CD
  orgIdentifier: default
  projectIdentifier: REPLACE_PROJECT_ID
  tags:
    app: hello-world-dotnet

  stages:
    ##########################################################################
    # STAGE 1 — Deploy to Kubernetes (Rolling)
    ##########################################################################
    - stage:
        name: Deploy
        identifier: Deploy
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: HelloWorldDotNet
            serviceInputs:
              serviceDefinition:
                type: Kubernetes
                spec:
                  artifacts:
                    primary:
                      primaryArtifactRef: primary
                      sources:
                        - identifier: primary
                          type: DockerRegistry
                          spec:
                            connectorRef: account.Dockerhub
                            imagePath: anandraiin3/hello-world-dotnet
                            tag: <+pipeline.sequenceId>
          environment:
            environmentRef: production
            deployToAll: false
            infrastructureDefinitions:
              - identifier: HelloWorldK8s
          execution:
            steps:
              # ── Helm Upgrade ──────────────────────────────────────────────
              - step:
                  name: Helm Deploy
                  identifier: Helm_Deploy
                  type: K8sRollingDeploy
                  timeout: 10m
                  spec:
                    skipDryRun: false
                    pruningEnabled: false

              # ── Continuous Verification ───────────────────────────────────
              # Analyses Dynatrace metrics for 15 min post-deploy.
              # Fails pipeline if response time, error rate, or throughput
              # regress vs. the baseline established on the previous deployment.
              - step:
                  type: Verify
                  name: CV - Dynatrace Health Check
                  identifier: CV_Dynatrace_Health_Check
                  timeout: 2h
                  spec:
                    monitoredServiceRef: HelloWorldDotNet_production
                    type: Rolling
                    spec:
                      sensitivity: MEDIUM
                      duration: 15m
                      deploymentTag: <+pipeline.sequenceId>
                  failureStrategies:
                    - onFailure:
                        errors:
                          - Verification
                        action:
                          type: ManualIntervention
                          spec:
                            timeout: 2h
                            onTimeout:
                              action:
                                type: MarkAsFailure
                  when:
                    stageStatus: Success

            rollbackSteps:
              - step:
                  name: Helm Rollback
                  identifier: Helm_Rollback
                  type: K8sRollingRollback
                  timeout: 10m
                  spec: {}

        tags:
          env: production

    ##########################################################################
    # STAGE 2 — Post-Deploy Approval (optional gate before marking success)
    ##########################################################################
    - stage:
        name: Post-Deploy Approval
        identifier: Post_Deploy_Approval
        type: Approval
        spec:
          execution:
            steps:
              - step:
                  name: Confirm Production Health
                  identifier: Confirm_Production_Health
                  type: HarnessApproval
                  timeout: 1d
                  spec:
                    approvalMessage: |
                      CV passed. Please confirm the deployment looks healthy in:
                        - Dynatrace service dashboard
                        - Application logs
                        - Smoke test results
                    includePipelineExecutionHistory: true
                    approvers:
                      minimumCount: 1
                      disallowPipelineExecutor: false
                      userGroups:
                        - REPLACE_APPROVER_GROUP
                    approverInputs: []
        when:
          pipelineStatus: Success
